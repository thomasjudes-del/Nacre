<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#061217;color:#b6c6b8;font:12px Arial}canvas{width:100vw;height:calc(100vh - 72px);display:block}nav{height:64px;display:flex;align-items:center;gap:10px;padding:0 12px}button{background:#193734;color:#d7dfc6;border:1px solid #537463;padding:8px;cursor:pointer}output{font:10px monospace;max-width:200px}</style></head><body><canvas id="view"></canvas><nav><button data-t="2.6">Arrivée</button><button data-t="5.5">Couvert</button><button data-t="14.3">Caisse</button><button data-t="15.3">Rebord</button><button data-t="15.5">Traction</button><button data-t="15.7">Appui</button><button data-t="19.6">Poursuite</button><button data-t="26">Patrouille</button><button data-t="29.5">Départ</button><button data-t="33.6">Fuite</button><button data-t="34.13">Saut gardien</button><button data-t="34.85">Plongeon</button><button data-t="35.95">Berge</button><button data-t="38.0">Eau</button><button data-t="40.2">Échelle</button><button data-t="41.7">Sortie</button><button id="play">Lire</button><button id="sweep">Tout vérifier</button><output id="status"></output></nav><script src="logic.js"></script><script src="props.js"></script><script src="run-capture.js"></script><script src="capture-rig.js"></script><script src="motion.js"></script><script src="character.js"></script><script src="art.js"></script><script src="convoy-logic.js"></script><script src="convoy-art.js"></script><script>
(async()=>{const frames=await(await fetch('qa-convoy-frames.json')).json(),a=new NacreConvoyArt(document.querySelector('canvas'));await Promise.all([a.backdrop,a.reservoir,a.machine,a.quay,a.actor.atlas,a.guard.atlas,a.guardAtlas].map(i=>i.decode().catch(()=>{})));let idx=150,playing=false;const status=document.querySelector('output');function render(){const s=frames[idx];a.render(s,1/60,'play');status.textContent='Entrées simulées | '+s.time.toFixed(2)+' s | x '+Math.round(s.x)+' | échecs '+s.deaths;}function select(i){idx=Math.max(0,Math.min(frames.length-1,i));a.cameraReady=false;a.actor.motion.reset();for(let j=Math.max(0,idx-180);j<idx;j++)a.render(frames[j],1/60,'play');render();}for(const b of document.querySelectorAll('[data-t]'))b.onclick=()=>{playing=false;select(Math.floor(+b.dataset.t*60));};document.querySelector('#play').onclick=()=>playing=!playing;document.querySelector('#sweep').onclick=async()=>{document.querySelector('#sweep').disabled=true;playing=false;a.cameraReady=false;try{for(let k=0;k<frames.length;k++){idx=k;render();if(k%80===0)await new Promise(r=>setTimeout(r,0));}status.textContent=frames.length+' images rendues, 0 erreur, fin atteinte.';document.querySelector('#sweep').disabled=false;}catch(e){status.textContent='ERREUR '+e.message;throw e;}};let last=0;function loop(t){if(playing&&t-last>16){last=t;idx=Math.min(frames.length-1,idx+1);render();}requestAnimationFrame(loop);}addEventListener('resize',()=>{a.resize();select(idx);});select(idx);requestAnimationFrame(loop);})();</script></body></html>
